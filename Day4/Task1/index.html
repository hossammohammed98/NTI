    //write a js code that finds the longest word within the string
    let text = "Web Development Tutorials";

    //trim ==> to remove any space in the word 
    //split ==> to divide it to array of words text=["Web","Development","Tutorials"]
    let words = text.trim().split(" ");
    let longest = "";

    for (let word of words) {
        if (word.length > longest.length) {
            longest = word;
        }
    }

    console.log(longest);
